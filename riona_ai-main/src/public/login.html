<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Epi-engage</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .login-container {
      max-width: 450px;
      margin: 100px auto;
    }
    .card {
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }
    .card-header {
      background-color: #343a40;
      color: white;
      border-radius: 10px 10px 0 0 !important;
      padding: 20px;
    }
    .btn-primary {
      background-color: #343a40;
      border-color: #343a40;
    }
    .btn-primary:hover {
      background-color: #23272b;
      border-color: #23272b;
    }
    .form-control:focus {
      border-color: #343a40;
      box-shadow: 0 0 0 0.25rem rgba(52, 58, 64, 0.25);
    }
    .alert {
      margin-bottom: 20px;
    }
    .register-link {
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container login-container">
    <div class="card">
      <div class="card-header text-center">
        <h3><i class="bi bi-instagram me-2"></i>Epi-engage</h3>
        <p class="mb-0">Login to access your dashboard</p>
      </div>
      <div class="card-body p-4">
        <div id="login-alert" class="alert alert-danger d-none" role="alert">
          <!-- Error messages will be displayed here -->
        </div>
        
        <form id="login-form">
          <div class="mb-3">
            <label for="username" class="form-label">Username or Email</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" id="username" name="username" required>
            </div>
          </div>
          
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" name="password" required>
              <button class="btn btn-outline-secondary" type="button" id="toggle-password">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="remember-me" name="remember">
            <label class="form-check-label" for="remember-me">Remember me</label>
          </div>
          
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary btn-lg">
              <i class="bi bi-box-arrow-in-right me-2"></i>Login
            </button>
          </div>
        </form>
      </div>
    </div>
    
    <div class="register-link">
      <p>Don't have an account? <a href="/register">Register here</a></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const loginForm = document.getElementById('login-form');
      const loginAlert = document.getElementById('login-alert');
      const togglePasswordBtn = document.getElementById('toggle-password');
      const passwordInput = document.getElementById('password');
      
      // Toggle password visibility
      togglePasswordBtn.addEventListener('click', function() {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.querySelector('i').classList.toggle('bi-eye');
        this.querySelector('i').classList.toggle('bi-eye-slash');
      });
      
      // Handle form submission
      loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        
        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, password })
          });
          
          const data = await response.json();
          
          if (!response.ok) {
            throw new Error(data.message || 'Login failed');
          }
          
          // Redirect to dashboard on successful login
          window.location.href = '/';
          
        } catch (error) {
          // Display error message
          loginAlert.textContent = error.message;
          loginAlert.classList.remove('d-none');
        }
      });
      
      // Check for error parameter in URL
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('error')) {
        loginAlert.textContent = 'Invalid username or password';
        loginAlert.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
